name: Validate agent repository
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical repository
        run: bash tests/validate-agent-repo.test.sh
      - name: Validate distributable DP skill
        run: bash tests/validate-dp-skill.test.sh
